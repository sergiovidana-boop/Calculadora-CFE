<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="solarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
  </defs>
  <!-- Fondo Redondeado App -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Estructura del Panel Solar -->
  <g transform="translate(0, 20)">
    <!-- Marco del panel -->
    <path d="M 112 180 L 400 180 L 432 370 L 80 370 Z" fill="none" stroke="#10b981" stroke-width="12" stroke-linejoin="round"/>
    <!-- Superficie del panel -->
    <path d="M 118 186 L 394 186 L 424 364 L 88 364 Z" fill="url(#solarGrad)" opacity="0.9"/>
    <!-- Lineas del panel -->
    <line x1="256" y1="186" x2="256" y2="364" stroke="#ffffff" stroke-width="6" opacity="0.7"/>
    <line x1="187" y1="186" x2="172" y2="364" stroke="#ffffff" stroke-width="4" opacity="0.5"/>
    <line x1="325" y1="186" x2="340" y2="364" stroke="#ffffff" stroke-width="4" opacity="0.5"/>
    <line x1="104" y1="275" x2="408" y2="275" stroke="#ffffff" stroke-width="5" opacity="0.6"/>
  </g>

  <!-- Rayo Eléctrico CFE Superpuesto -->
  <path d="M 280 80 L 190 250 L 260 250 L 220 410 L 340 220 L 270 220 Z" fill="url(#boltGrad)" stroke="#022c22" stroke-width="8" stroke-linejoin="round"/>
</svg>
